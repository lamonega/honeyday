name: honeyday
description: >-
  Digital agenda & journal app with freehand ink, modular widgets,
  and a warm paper aesthetic. Built with Flutter for Android, iOS,
  Web, Linux, macOS, and Windows.
publish_to: 'none'
version: 0.3.0+1

homepage: https://github.com/lamonega/honeyday
repository: https://github.com/lamonega/honeyday
issue_tracker: https://github.com/lamonega/honeyday/issues

topics:
  - agenda
  - journal
  - digital-planner
  - ink-canvas
  - flutter-app

environment:
  sdk: ^3.13.3

dependencies:
  archive: ^4.3.0
  drift: ^2.35.0
  drift_flutter: ^0.3.1
  file_selector: ^1.1.0
  flutter:
    sdk: flutter
  flutter_animate: ^4.5.2
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.1
  google_fonts: ^8.2.1
  haptic_feedback: ^0.6.5
  intl: any
  meta: ^1.16.0
  package_info_plus: ^10.2.1
  perfect_freehand: ^2.5.2+1
  share_plus: ^13.3.0
  shared_preferences: ^2.5.5
  uuid: ^4.6.0
  web: ^1.1.1

dev_dependencies:
  alchemist: ^0.14.0
  build_runner: ^2.16.1
  crypto: ^3.0.7
  drift_dev: ^2.35.0
  flutter_test:
    sdk: flutter
  pdf: ^3.13.1
  very_good_analysis: ^11.0.0

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/fonts/
    - assets/icons/
    - assets/images/

  # Flutter Web otherwise downloads Roboto before Dart's main() runs.
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Thin.ttf
          weight: 100
        - asset: assets/fonts/Roboto-Light.ttf
          weight: 300
        - asset: assets/fonts/Roboto-Regular.ttf
          weight: 400
        - asset: assets/fonts/Roboto-Medium.ttf
          weight: 500
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
        - asset: assets/fonts/Roboto-Black.ttf
          weight: 900
