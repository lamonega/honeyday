name: honeyday
description: >-
  Digital agenda & journal app with freehand ink, modular widgets,
  and a warm paper aesthetic. Built with Flutter for Android, iOS,
  Web, Linux, macOS, and Windows.
publish_to: 'none'
version: 0.1.6+1

homepage: https://github.com/lamonega/honeyday
repository: https://github.com/lamonega/honeyday
issue_tracker: https://github.com/lamonega/honeyday/issues

topics:
  - agenda
  - journal
  - digital-planner
  - ink-canvas
  - flutter-app

environment:
  sdk: ^3.13.3

dependencies:
  cupertino_icons: ^1.0.8
  dio: ^5.11.1
  drift: ^2.35.0
  drift_flutter: ^0.3.1
  dynamic_color: ^1.7.0
  flutter:
    sdk: flutter
  flutter_animate: ^4.5.2
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.1
  google_fonts: ^8.2.1
  haptic_feedback: ^0.5.1+1
  path_provider: ^2.1.6
  perfect_freehand: ^2.5.2+1
  shared_preferences: ^2.5.5
  shimmer: ^3.0.0
  uuid: ^4.6.0

dev_dependencies:
  alchemist: ^0.14.0
  build_runner: ^2.16.1
  drift_dev: ^2.35.0
  flutter_test:
    sdk: flutter
  mcp_toolkit: ^5.1.0
  very_good_analysis: ^11.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/images/
