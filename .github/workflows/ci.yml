name: CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

jobs:
  build:
    # Windows runner: alchemist golden tests were recorded for the Windows
    # and CI variants; Linux would need a separate goldens/linux set.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: dart analyze --fatal-infos

      - name: Test
        run: flutter test

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Rebuild Drift worker from locked dependencies
        run: dart run tool/build_drift_worker.dart

      - name: Verify committed Drift worker is current
        run: git diff --exit-code -- web/drift_worker.js

      - name: Build web (JavaScript)
        # This checks the shipped JS target, not optional Wasm compatibility.
        run: flutter build web --no-pub --no-wasm-dry-run

      - name: Verify compiler dependency metadata is not shipped
        run: |
          if find build/web -name '*.deps' -print -quit | grep -q .; then
            echo "::error::Compiler dependency metadata must not be shipped"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify IndexedDB persistence across a browser reload
        run: node tool/test_web_persistence.mjs
